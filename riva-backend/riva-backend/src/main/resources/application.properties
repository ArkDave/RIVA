# ─── Server ───────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api

# ─── Database (PostgreSQL) ────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/riva_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── SQL Initialization ──────────────────────────────────
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql

# ─── JPA / Hibernate ─────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.properties.hibernate.implicit_naming_strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
spring.jpa.open-in-view=false

# ─── JWT ─────────────────────────────────────────────────
riva.jwt.secret=REPLACE_WITH_256BIT_SECRET_KEY_IN_PRODUCTION_ENV
riva.jwt.expiration-ms=86400000

# ─── File Upload ─────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
riva.upload.dir=uploads/

# ─── CORS ────────────────────────────────────────────────
riva.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ─── Logging ─────────────────────────────────────────────
logging.level.com.riva=DEBUG
logging.level.org.springframework.security=INFO
